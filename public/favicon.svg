<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background subtle dark circle for maximum contrast on light and dark browser tabs -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#a21caf" />
    </radialGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark base disc -->
  <circle cx="32" cy="32" r="30" fill="#090D16" stroke="#2a1b3d" stroke-width="2" />

  <!-- Outer Magenta Halo -->
  <circle cx="32" cy="32" r="18" fill="#d946ef" opacity="0.3" filter="url(#neonGlow)" />

  <!-- Iconic Pink/Fuchsia Dot matching Moockup Studio Wordmark -->
  <circle cx="32" cy="32" r="14" fill="url(#dotGlow)" filter="url(#neonGlow)" />

  <!-- Glossy light reflection highlight -->
  <ellipse cx="28" cy="27" rx="5" ry="3" fill="#ffffff" opacity="0.6" />
</svg>
