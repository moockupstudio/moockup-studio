<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="fuchsiaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>
    <filter id="fuchsiaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#d946ef" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g transform="translate(10, 20)">
    <!-- Wordmark: moockup. -->
    <text 
      x="0" 
      y="55" 
      font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
      font-size="52" 
      font-weight="900" 
      font-style="italic" 
      letter-spacing="-0.04em" 
      fill="#ffffff"
    >
      moockup<tspan fill="url(#fuchsiaGradient)" filter="url(#fuchsiaGlow)">.</tspan>
    </text>

    <!-- Tagline: your vision, our mission -->
    <text 
      x="2" 
      y="84" 
      font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
      font-size="16" 
      font-weight="600" 
      font-style="italic" 
      letter-spacing="0.08em" 
      fill="#e879f9"
      opacity="0.95"
    >
      your vision, our mission
    </text>
  </g>
</svg>
